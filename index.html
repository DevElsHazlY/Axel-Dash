<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Axel Dash</title>
<style>
  :root{
    --bg-dark:#05050d;
    --neon-blue:#1e9bff;
    --neon-blue-dim:#0d4a80;
    --neon-red:#ff3b3b;
    --neon-gold:#ffd23f;
    --neon-green:#38e07a;
    --panel-bg:rgba(8,10,20,0.92);
    --text:#eaf2ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg-dark); user-select:none; -webkit-user-select:none;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif; color:var(--text);
  }
  #gameWrap{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  }
  canvas{
    display:block; background:#05050d; box-shadow:0 0 30px rgba(30,155,255,0.25);
    touch-action:none;
  }

  /* ===== HUD ===== */
  #hud{
    position:fixed; top:14px; left:14px; right:14px; display:flex; justify-content:space-between;
    align-items:flex-start; pointer-events:none; font-size:14px; z-index:5;
  }
  #hudLeft div{ opacity:.85; margin-bottom:4px; text-shadow:0 0 6px rgba(0,0,0,.8); }
  #hudLeft .score{ font-size:20px; font-weight:bold; color:var(--neon-blue); text-shadow:0 0 10px var(--neon-blue); }
  #pauseBtn{
    pointer-events:all; width:38px; height:38px; border-radius:50%;
    background:rgba(20,22,35,0.85); border:2px solid var(--neon-blue);
    color:var(--text); font-size:16px; cursor:pointer; box-shadow:0 0 12px rgba(30,155,255,.5);
  }
  #hud, #pauseBtn{ display:none; }
  .in-playing #hud, .in-paused #hud{ display:flex; }
  .in-playing #pauseBtn{ display:block; }

  /* ===== Screens ===== */
  .screen{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; background:var(--panel-bg); backdrop-filter:blur(6px);
    text-align:center; z-index:10; padding:24px;
  }
  .screen.active{ display:flex; }
  .logo{
    font-size:2.4em; font-weight:900; letter-spacing:2px; color:var(--neon-blue);
    text-shadow:0 0 18px var(--neon-blue), 0 0 40px rgba(30,155,255,.5); margin-bottom:6px;
  }
  .subtitle{ opacity:.7; font-size:.9em; margin-bottom:28px; }

  .neon-btn{
    display:block; width:78%; max-width:320px; margin:9px auto; padding:14px 20px;
    font-size:1.05em; font-weight:bold; border:none; border-radius:100px; cursor:pointer;
    color:#05050d; background:var(--neon-blue); box-shadow:0 0 22px rgba(30,155,255,.65);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .neon-btn:active{ transform:scale(.95); box-shadow:0 0 10px rgba(30,155,255,.4); }
  .neon-btn.secondary{ background:transparent; color:var(--neon-blue); border:2px solid var(--neon-blue); box-shadow:0 0 12px rgba(30,155,255,.25); }
  .neon-btn.danger{ background:var(--neon-red); box-shadow:0 0 22px rgba(255,59,59,.6); }
  .neon-btn.gold{ background:var(--neon-gold); box-shadow:0 0 22px rgba(255,210,63,.6); }

  .stat-row{ display:flex; gap:22px; margin-bottom:20px; }
  .stat-box{ background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:10px 18px; min-width:90px; }
  .stat-box .val{ font-size:1.3em; font-weight:bold; }
  .stat-box .lbl{ font-size:.7em; opacity:.6; }

  .settings-row{
    width:82%; max-width:340px; display:flex; align-items:center; justify-content:space-between;
    margin:14px 0; font-size:.95em;
  }
  .settings-row input[type=range]{ width:150px; accent-color:var(--neon-blue); }
  .toggle{
    width:48px; height:26px; border-radius:20px; background:rgba(255,255,255,.15);
    position:relative; cursor:pointer; border:1px solid rgba(255,255,255,.2);
  }
  .toggle .knob{ position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; background:#888; transition:.15s; }
  .toggle.on{ background:rgba(30,155,255,.35); border-color:var(--neon-blue); }
  .toggle.on .knob{ right:24px; background:var(--neon-blue); box-shadow:0 0 8px var(--neon-blue); }

  #worldStrip{ display:flex; gap:10px; margin:8px 0 22px; flex-wrap:wrap; justify-content:center; }
  .world-chip{ padding:6px 14px; border-radius:20px; font-size:.75em; border:1px solid rgba(255,255,255,.15); opacity:.5; }
  .world-chip.unlocked{ opacity:1; box-shadow:0 0 10px currentColor; }

  #skinGrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; width:86%; max-width:340px; margin:10px 0 24px; }
  .skin-card{
    background:rgba(255,255,255,.04); border:2px solid rgba(255,255,255,.12); border-radius:16px;
    padding:14px 8px; cursor:pointer; transition:.15s;
  }
  .skin-card .swatch{ width:44px; height:44px; margin:0 auto 8px; border-radius:10px; }
  .skin-card .name{ font-size:.85em; font-weight:bold; }
  .skin-card .cost{ font-size:.7em; opacity:.65; margin-top:4px; }
  .skin-card.selected{ border-color:var(--neon-gold); box-shadow:0 0 16px rgba(255,210,63,.5); }
  .skin-card.locked{ opacity:.55; }

  .touch-hint{ position:fixed; bottom:28px; left:0; right:0; text-align:center; font-size:.85em; opacity:.6; pointer-events:none; }
  #comboBanner{
    position:fixed; top:70px; left:50%; transform:translateX(-50%); font-size:1.1em; font-weight:bold;
    color:var(--neon-gold); text-shadow:0 0 14px var(--neon-gold); opacity:0; transition:opacity .25s, top .25s; z-index:6; pointer-events:none;
  }
</style>
</head>
<body class="in-boot">

  <div id="hud">
    <div id="hudLeft">
      <div class="score" id="hudScore">0</div>
      <div id="hudCoins">🪙 0</div>
      <div id="hudBest">🏆 0</div>
    </div>
    <button id="pauseBtn">⏸</button>
  </div>
  <div id="comboBanner"></div>

  <div id="gameWrap">
    <canvas id="gameCanvas" width="390" height="600"></canvas>
  </div>

  <!-- شاشة البداية -->
  <div class="screen active" data-screen="boot">
    <div class="logo">AXEL DASH</div>
    <div class="subtitle">جاري التحميل...</div>
  </div>

  <!-- القائمة الرئيسية -->
  <div class="screen" data-screen="menu">
    <div class="logo">AXEL DASH</div>
    <div class="subtitle">اقفز، تفادَ، اجمع، استمر</div>
    <div class="stat-row">
      <div class="stat-box"><div class="val" id="menuBest">0</div><div class="lbl">أفضل نتيجة</div></div>
      <div class="stat-box"><div class="val" id="menuCoins">0</div><div class="lbl">العملات</div></div>
    </div>

    <button class="neon-btn" id="btnPlay">▶ ابدأ اللعب</button>
    <button class="neon-btn secondary" id="btnShop">🎨 المتجر</button>
    <button class="neon-btn secondary" id="btnSettings">⚙ الإعدادات</button>
  </div>

  <!-- المتجر (الأشكال) -->
  <div class="screen" data-screen="shop">
    <div class="logo" style="font-size:1.6em;">المتجر</div>
    <div class="subtitle" id="shopCoins">🪙 0</div>
    <div id="skinGrid"></div>
    <button class="neon-btn" id="btnBackFromShop">رجوع</button>
  </div>

  <!-- الإعدادات -->
  <div class="screen" data-screen="settings">
    <div class="logo" style="font-size:1.6em;">الإعدادات</div>
    <div class="settings-row"><span>🎵 الموسيقى</span><input type="range" id="musicSlider" min="0" max="100" value="60"></div>
    <div class="settings-row"><span>🔊 المؤثرات</span><input type="range" id="sfxSlider" min="0" max="100" value="100"></div>
    <div class="settings-row"><span>📳 الاهتزاز</span><div class="toggle on" id="vibToggle"><div class="knob"></div></div></div>
    <button class="neon-btn secondary" id="btnResetProgress" style="margin-top:18px;">إعادة ضبط التقدم</button>
    <button class="neon-btn" id="btnBackFromSettings">رجوع</button>
  </div>

  <!-- إيقاف مؤقت -->
  <div class="screen" data-screen="pause">
    <div class="logo" style="font-size:1.8em;">إيقاف مؤقت</div>
    <button class="neon-btn" id="btnResume">▶ استمرار</button>
    <button class="neon-btn secondary" id="btnRestartFromPause">↻ إعادة البدء</button>
    <button class="neon-btn danger" id="btnMenuFromPause">🏠 القائمة الرئيسية</button>
  </div>

  <!-- نهاية اللعبة -->
  <div class="screen" data-screen="gameover">
    <div class="logo" style="color:var(--neon-red); text-shadow:0 0 18px var(--neon-red);">لقد خسرت</div>
    <div class="stat-row">
      <div class="stat-box"><div class="val" id="goScore">0</div><div class="lbl">النتيجة</div></div>
      <div class="stat-box"><div class="val" id="goBest">0</div><div class="lbl">الأفضل</div></div>
      <div class="stat-box"><div class="val" id="goCoins">0</div><div class="lbl">العملات</div></div>
    </div>
    <button class="neon-btn gold" id="btnRestart">↻ إعادة المحاولة</button>
    <button class="neon-btn secondary" id="btnMenuFromGameOver">🏠 القائمة الرئيسية</button>
  </div>

  <div class="touch-hint" id="touchHint">إلمس الشاشة للقفز</div>

<script>
(function(){
"use strict";

/* ============================================================
   1) CONFIG — كل الأرقام السحرية القديمة أصبحت هنا فقط
   ============================================================ */
const CFG = {
  W: 390, H: 600,
  gravity: 0.7,
  jumpPower: -11,
  playerSize: 50,
  baseObstacleSpeed: 7,
  speedIncrement: 0.2,
  speedEvery: 10,
  powerUpInterval: 3500,
  powerUpDuration: 6000,        // كانت 80ms فقط في الأصل (باغ) — صححناها لمدة معقولة
  minGap: 300, maxGap: 400,
};

const STORE_KEY = 'axeldash_save_v2';

/* ============================================================
   2.b) الأشكال (Skins) — منفصلة عن العالم، تُشترى بالعملات
   نفس فلسفة العوالم: بيانات ألوان فقط، بدون أصول رسومية جديدة
   ============================================================ */
const SKINS = [
  { id:'default', name:'كلاسيكي', cost:0,  outer:'#1e5fff', inner:'#8B0000', glow:'#1e9bff' },
  { id:'emerald', name:'زمردي',   cost:80, outer:'#12ff9c', inner:'#003b2a', glow:'#12ff9c' },
  { id:'violet',  name:'بنفسجي',  cost:120,outer:'#b23bff', inner:'#2a003b', glow:'#c96bff' },
  { id:'gold',    name:'ذهبي',    cost:200,outer:'#ffd23f', inner:'#5c3d00', glow:'#ffe27a' },
];

/* ============================================================
   2.c) الإنجازات — تُفحص تلقائياً بعد كل جولة
   ============================================================ */
const ACHIEVEMENTS = [
  { id:'score_100',  name:'🏁 مسافة 100',      check:s => s.bestScore >= 100 },
  { id:'score_350',  name:'🚀 مسافة 350',      check:s => s.bestScore >= 350 },
  { id:'coins_100',  name:'🪙 100 عملة',        check:s => s.totalCoins >= 100 },
  { id:'all_worlds', name:'🌍 كل العوالم',      check:s => WORLDS.every(w => s.unlockedWorlds.includes(w.id)) },
  { id:'all_skins',  name:'🎨 كل الأشكال',      check:s => SKINS.every(k => s.unlockedSkins.includes(k.id)) },
];

/* ============================================================
   2) عوالم اللعبة — بيانات فقط، بدون أصول جديدة (تلوين/توهج إجرائي)
   ============================================================ */
const WORLDS = [
  { id:'default', name:'الأساسي', unlockScore:0,
    bgTop:'#05050d', bgBottom:'#0b0f22', obstacle:'#ffffff', accent:'#1e9bff',
    playerOuter:'#1e5fff', playerInner:'#8B0000', glow:'#1e9bff' },
  { id:'volcano', name:'البركان', unlockScore:150,
    bgTop:'#1a0500', bgBottom:'#3a0e00', obstacle:'#ff8a3d', accent:'#ff3b3b',
    playerOuter:'#ff6600', playerInner:'#330000', glow:'#ff5500' },
  { id:'frost', name:'الجليد', unlockScore:350,
    bgTop:'#001225', bgBottom:'#012a45', obstacle:'#bdf3ff', accent:'#40d9ff',
    playerOuter:'#12c2ff', playerInner:'#013a5c', glow:'#40d9ff' },
];

/* ============================================================
   3) مكتبة أنماط العوائق — تصميم يدوي بدل عشوائية بحتة
   كل نمط = تركيبة (عائق/ترامبولين/فراغ) بصعوبة معروفة
   ============================================================ */
const PATTERNS = [
  { id:'single',      minSpeed:0,  obstacles:[0],          traps:[],     gap:340 },
  { id:'double',       minSpeed:0,  obstacles:[0,55],       traps:[],     gap:380 },
  { id:'spike_trap',   minSpeed:0,  obstacles:[0],          traps:[150],  gap:360 },
  { id:'triple',       minSpeed:8,  obstacles:[0,50,100],   traps:[],     gap:420 },
  { id:'trap_only',    minSpeed:7,  obstacles:[],           traps:[40],   gap:300 },
];

/* ============================================================
   4) أداة تخزين — SaveManager (يحل مشكلة فقدان الأفضلية سابقاً)
   ============================================================ */
const SaveManager = {
  defaults(){ return { highScore:0, totalCoins:0, unlockedWorlds:['default'],
    unlockedSkins:['default'], selectedSkin:'default', unlockedAchievements:[],
    settings:{ music:0.6, sfx:1, vibration:true } }; },
  load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return this.defaults();
      const parsed = JSON.parse(raw);
      return Object.assign(this.defaults(), parsed);
    }catch(e){ return this.defaults(); }
  },
  save(data){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){/* تجاهل بيئات بدون تخزين */}
  }
};
let SAVE = SaveManager.load();

/* ============================================================
   5) نظام الصوت — تجميع (Pool) للمؤثرات + أصوات مصنّعة بدون ملفات
   ============================================================ */
const AudioManager = (function(){
  function makePool(src, size){
    const pool = [];
    for(let i=0;i<size;i++){ const a = new Audio(src); a.preload='auto'; pool.push(a); }
    let idx = 0;
    return {
      play(vol){
        const a = pool[idx]; idx = (idx+1) % pool.length;
        try{ a.pause(); a.currentTime = 0; a.volume = vol; a.play().catch(()=>{}); }catch(e){}
      },
      setBaseRate(r){ pool.forEach(a=>a.playbackRate = r); }
    };
  }

  const music = new Audio('file:///android_asset/bg.mp3');
  music.loop = true;
  const jumpPool = makePool('file:///android_asset/Jump.mp3', 4);
  const hitPool  = makePool('file:///android_asset/Hit.mp3', 2);

  // أصوات "بلوب" مصنّعة عبر Web Audio API — بدون أي ملف خارجي
  let actx = null;
  function ensureCtx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function blip(freqStart, freqEnd, dur, vol){
    const ctx = ensureCtx(); if(!ctx) return;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freqStart, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), ctx.currentTime+dur);
    g.gain.setValueAtTime(vol * SAVE.settings.sfx, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+dur);
  }

  return {
    playJump(){ jumpPool.play(SAVE.settings.sfx); },
    playHit(){ hitPool.play(SAVE.settings.sfx); },
    playCoin(){ blip(700, 1200, 0.12, 0.25); },
    playPowerUp(){ blip(300, 900, 0.25, 0.3); },
    playUnlock(){ blip(400, 1500, 0.4, 0.35); },
    startMusic(){ music.volume = SAVE.settings.music; music.currentTime = 0; music.play().catch(()=>{}); },
    stopMusic(){ music.pause(); },
    resumeMusic(){ music.play().catch(()=>{}); },
    setMusicRate(r){ music.playbackRate = r; },
    setMusicVolume(v){ SAVE.settings.music = v; music.volume = v; },
    setSfxVolume(v){ SAVE.settings.sfx = v; },
  };
})();

/* ============================================================
   6) تجميع الكائنات (Object Pool) عام لأي نوع كائن
   ============================================================ */
function createPool(factory){
  const items = [];
  return {
    all: items,
    spawn(overrides){ const it = factory(); Object.assign(it, overrides); items.push(it); return it; },
    clear(){ items.length = 0; },
    removeWhere(pred){ for(let i=items.length-1;i>=0;i--){ if(pred(items[i])) items.splice(i,1); } }
  };
}

/* ============================================================
   7) حالة اللعبة الأساسية
   ============================================================ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentWorld = WORLDS[0];
let player, score, coinCount, obstacleSpeed, isGameOver, lastTime, activePowerUps, lastPowerUpTime, nextPatternX;

const obstaclesPool = createPool(()=>({x:0,y:0,width:30,height:30}));
const trapsPool     = createPool(()=>({x:0,y:0,width:30,height:10,isActivated:false}));
const platformsPool = createPool(()=>({x:0,y:0,width:100,height:10}));
const coinsPool      = createPool(()=>({x:0,y:0,width:20,height:20}));
const powerUpsPool   = createPool(()=>({x:0,y:0,width:20,height:20,type:'speed'}));
const particlesPool  = createPool(()=>({x:0,y:0,life:0,maxLife:0,vx:0,vy:0,r:0,color:'#fff'}));

function resetPlayer(){
  player = {
    x:50, y: CFG.H - CFG.playerSize, width:CFG.playerSize, height:CFG.playerSize,
    velocityY:0, isJumping:false, rotation:0, rotationSpeed:0.15,
  };
}

function selectWorldForScore(s){
  let w = WORLDS[0];
  for(const world of WORLDS){ if(s >= world.unlockScore) w = world; }
  return w;
}

function startRun(){
  currentWorld = selectWorldForScore(0);
  resetPlayer();
  score = 0; coinCount = 0; obstacleSpeed = CFG.baseObstacleSpeed;
  isGameOver = false; activePowerUps = {}; lastPowerUpTime = 0; nextPatternX = CFG.W + 60;
  obstaclesPool.clear(); trapsPool.clear(); platformsPool.clear(); coinsPool.clear(); powerUpsPool.clear(); particlesPool.clear();
  spawnInitialContent();
  AudioManager.setMusicRate(1);
  AudioManager.startMusic();
  lastTime = performance.now();
}

/* ============================================================
   8) توليد المحتوى — يعتمد على مكتبة الأنماط بدل العشوائية الكاملة
   ============================================================ */
function pickPattern(){
  const candidates = PATTERNS.filter(p => obstacleSpeed >= p.minSpeed);
  return candidates[Math.floor(Math.random()*candidates.length)];
}

function spawnPatternAt(x){
  const p = pickPattern();
  p.obstacles.forEach(off=>{
    obstaclesPool.spawn({ x:x+off, y:CFG.H, width:30+Math.random()*10, height:30+Math.random()*10 });
  });
  p.traps.forEach(off=>{
    trapsPool.spawn({ x:x+off, y:CFG.H-2, width:34, height:10, isActivated:false });
  });
  // عملة عشوائية مصاحبة أحياناً
  if(Math.random() < 0.6){
    coinsPool.spawn({ x:x+40+Math.random()*80, y: CFG.H - 90 - Math.random()*100, width:20, height:20 });
  }
  nextPatternX = x + p.gap;
}

function spawnInitialContent(){
  let x = CFG.W + 80;
  for(let i=0;i<4;i++){ spawnPatternAt(x); x = nextPatternX; }
  for(let i=0;i<3;i++){
    platformsPool.spawn({ x: CFG.W + 200*i, y: CFG.H - 150 - Math.random()*100, width:100, height:10 });
  }
}

function maybeSpawnPowerUp(now){
  if(now - lastPowerUpTime >= CFG.powerUpInterval && powerUpsPool.all.length < 2){
    const types = ['speed','slow','coinMultiplier'];
    const type = types[Math.floor(Math.random()*types.length)];
    powerUpsPool.spawn({
      x: CFG.W + Math.random()*200, y: CFG.H - 90 - Math.random()*100,
      width:20, height:20, type,
      color: type==='speed' ? '#ff3b3b' : type==='slow' ? '#1e9bff' : '#38e07a'
    });
    lastPowerUpTime = now;
  }
}

/* ============================================================
   9) القدرات الخاصة — تم إصلاح باغ التكرار والانتهاء الخاطئ
   ============================================================ */
function applyPowerUp(type){
  const now = performance.now();
  if(type === 'speed' && !activePowerUps.speed){
    obstacleSpeed += 2; activePowerUps.speed = now + CFG.powerUpDuration;
  } else if(type === 'slow' && !activePowerUps.slow){
    obstacleSpeed = Math.max(2, obstacleSpeed - 2); activePowerUps.slow = now + CFG.powerUpDuration;
  } else if(type === 'coinMultiplier' && !activePowerUps.coinMultiplier){
    activePowerUps.coinMultiplier = now + CFG.powerUpDuration;
  }
  AudioManager.playPowerUp();
  showCombo(type === 'speed' ? '⚡ سرعة' : type==='slow' ? '🐌 تباطؤ' : '💰 x2 عملات');
}
function updatePowerUps(now){
  if(activePowerUps.speed && now > activePowerUps.speed){ obstacleSpeed -= 2; delete activePowerUps.speed; }
  if(activePowerUps.slow && now > activePowerUps.slow){ obstacleSpeed += 2; delete activePowerUps.slow; }
  if(activePowerUps.coinMultiplier && now > activePowerUps.coinMultiplier){ delete activePowerUps.coinMultiplier; }
}

/* ============================================================
   10) الفيزياء والتحديث — الآن بمعامل زمني (delta-time) لثبات السرعة
   عبر مختلف الأجهزة (لم يكن موجوداً في الأصل)
   ============================================================ */
function update(dt){
  const now = performance.now();
  const df = dt / (1000/60); // معامل التطبيع مقابل 60fps

  // اللاعب
  player.y += player.velocityY * df;
  player.velocityY += CFG.gravity * df;
  if(player.y > CFG.H - player.height){
    player.y = CFG.H - player.height; player.velocityY = 0; player.isJumping = false; player.rotation = 0;
  } else if(player.isJumping){
    player.rotation += player.rotationSpeed * df;
    spawnFireParticle(player.x + player.width/6, player.y + player.height/6);
  }

  const speedDelta = obstacleSpeed * df;

  // عوائق
  obstaclesPool.all.forEach(o=>{
    o.x -= speedDelta;
    if(collide(player, o, true)) return triggerGameOver();
  });
  obstaclesPool.removeWhere(o => o.x < -o.width - 200);

  // ترامبولين
  trapsPool.all.forEach(t=>{
    t.x -= speedDelta;
    if(!t.isActivated && collide(player, {x:t.x,y:t.y-t.height,width:t.width,height:t.height})){
      t.isActivated = true; player.velocityY = CFG.jumpPower*2; player.isJumping = true; AudioManager.playJump();
    }
    if(t.x < -t.width - 40) t.isActivated = false;
  });
  trapsPool.removeWhere(t => t.x < -t.width - 200);

  // منصات طائرة
  platformsPool.all.forEach(p=>{
    p.x -= speedDelta;
    const falling = player.velocityY >= 0;
    if(falling && player.x < p.x+p.width && player.x+player.width > p.x &&
       player.y+player.height > p.y && player.y+player.height < p.y + p.height + player.velocityY*df + 4){
      player.y = p.y - player.height; player.velocityY = 0; player.isJumping = false; player.rotation = 0;
    }
    if(p.x < -p.width - 40){ p.x = nextPatternX + Math.random()*150; p.y = CFG.H - 150 - Math.random()*100; }
  });

  // عملات
  coinsPool.all.forEach(c=>{
    c.x -= speedDelta;
    if(collide(player, c)){
      c.x = -9999;
      coinCount += activePowerUps.coinMultiplier ? 2 : 1;
      AudioManager.playCoin();
    }
  });
  coinsPool.removeWhere(c => c.x < -50);

  // قدرات
  powerUpsPool.all.forEach(p=>{
    p.x -= speedDelta;
    if(collide(player, p)){ applyPowerUp(p.type); p.x = -9999; }
  });
  powerUpsPool.removeWhere(p => p.x < -50);
  maybeSpawnPowerUp(now);
  updatePowerUps(now);

  // توليد أنماط جديدة عند اقتراب النهاية
  if(nextPatternX - (CFG.W) < 260){ spawnPatternAt(nextPatternX); }
  nextPatternX -= speedDelta;

  // النتيجة تتقدم مع الزمن + تسارع تدريجي
  score += df * 0.12;
  const scoreInt = Math.floor(score);
  if(scoreInt > 0 && scoreInt % CFG.speedEvery === 0 && Math.floor(score-df*0.12) < scoreInt){
    obstacleSpeed += CFG.speedIncrement;
    AudioManager.setMusicRate(Math.min(1.8, 1 + (obstacleSpeed-CFG.baseObstacleSpeed)/12));
  }

  // تبديل العالم تلقائياً حسب النتيجة
  const w = selectWorldForScore(scoreInt);
  if(w.id !== currentWorld.id){
    currentWorld = w;
    if(!SAVE.unlockedWorlds.includes(w.id)){
      SAVE.unlockedWorlds.push(w.id); SaveManager.save(SAVE); AudioManager.playUnlock(); showCombo('🌍 عالم جديد: '+w.name);
    }
  }

  updateParticles(df);
}

function collide(a, b, isTriangleObstacle){
  if(isTriangleObstacle){
    return a.x < b.x + b.width && a.x + a.width > b.x &&
           a.y < b.y && a.y + a.height > b.y - b.height;
  }
  return a.x < b.x + b.width && a.x + a.width > b.x &&
         a.y < b.y + b.height && a.y + a.height > b.y;
}

function jump(){
  if(!player.isJumping && !isGameOver){
    player.velocityY = CFG.jumpPower; player.isJumping = true; AudioManager.playJump();
    if(SAVE.settings.vibration && navigator.vibrate) navigator.vibrate(15);
  }
}

/* ============================================================
   11) جزيئات (انفجار + نار) — نفس الفكرة الأصلية، منظمة عبر Pool
   ============================================================ */
function spawnFireParticle(x,y){
  if(Math.random() > 0.5) return; // تقليل الكثافة للأداء
  particlesPool.spawn({ x, y, life:0, maxLife:20, vx:(Math.random()-0.5)*1, vy:(Math.random()-0.5)*1,
    r:Math.random()*12+4, color:'rgba(135,206,250,0.6)', kind:'fire' });
}
function spawnExplosion(x,y){
  for(let i=0;i<14;i++){
    const angle = Math.random()*Math.PI*2, speed = 1+Math.random()*3;
    particlesPool.spawn({ x,y, life:0, maxLife:30, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      r:Math.random()*5+2, color: Math.random()>0.5?'#ffd23f':'#ff3b3b', kind:'spark' });
  }
}
function updateParticles(df){
  particlesPool.all.forEach(p=>{ p.life += df; p.x += p.vx*df; p.y += p.vy*df; });
  particlesPool.removeWhere(p => p.life > p.maxLife);
}

/* ============================================================
   12) الرسم — خلفية إجرائية متدرجة (بدون أي صورة جديدة) حسب العالم
   + توهج مُحسَّن الأداء (offscreen مسبق التجهيز بدل shadowBlur لكل عائق)
   ============================================================ */
let glowSpriteCache = {};
function getGlowSprite(color){
  if(glowSpriteCache[color]) return glowSpriteCache[color];
  const off = document.createElement('canvas'); off.width = 60; off.height = 60;
  const octx = off.getContext('2d');
  octx.shadowColor = color; octx.shadowBlur = 22; octx.fillStyle = color;
  octx.beginPath(); octx.arc(30,30,6,0,Math.PI*2); octx.fill();
  glowSpriteCache[color] = off;
  return off;
}

function drawBackground(){
  const grad = ctx.createLinearGradient(0,0,0,CFG.H);
  grad.addColorStop(0, currentWorld.bgTop); grad.addColorStop(1, currentWorld.bgBottom);
  ctx.fillStyle = grad; ctx.fillRect(0,0,CFG.W,CFG.H);
  // خط أرض متوهج
  ctx.fillStyle = currentWorld.accent; ctx.globalAlpha = 0.5;
  ctx.fillRect(0, CFG.H-2, CFG.W, 2); ctx.globalAlpha = 1;
}

function getSelectedSkin(){
  return SKINS.find(s => s.id === SAVE.selectedSkin) || SKINS[0];
}

function drawPlayer(){
  const skin = getSelectedSkin();
  ctx.save();
  ctx.translate(player.x+player.width/2, player.y+player.height/2);
  ctx.rotate(player.rotation);
  ctx.translate(-player.width/2, -player.height/2);
  ctx.shadowColor = skin.glow; ctx.shadowBlur = 28;
  const g = ctx.createLinearGradient(0,0,player.width,player.height);
  g.addColorStop(0, skin.outer); g.addColorStop(1,'#001a33');
  ctx.fillStyle = g; ctx.fillRect(0,0,player.width,player.height);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#D3D3D3'; ctx.fillRect(10,10,player.width-20,player.height-20);
  ctx.fillStyle = skin.inner;
  ctx.beginPath();
  ctx.moveTo(player.width/2,20); ctx.lineTo(player.width-20,player.height/2);
  ctx.lineTo(player.width/2,player.height-20); ctx.lineTo(20,player.height/2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawWorld(){
  drawBackground();
  const sprite = getGlowSprite(currentWorld.obstacle);
  ctx.fillStyle = currentWorld.obstacle;
  obstaclesPool.all.forEach(o=>{
    ctx.beginPath();
    ctx.moveTo(o.x,o.y); ctx.lineTo(o.x+o.width/2,o.y-o.height); ctx.lineTo(o.x+o.width,o.y);
    ctx.closePath(); ctx.fill();
    ctx.drawImage(sprite, o.x+o.width/2-30, o.y-o.height-24, 60, 60); // توهج مُخزَّن مسبقاً بدل إعادة حسابه
  });
  ctx.fillStyle = '#ff8a00';
  trapsPool.all.forEach(t=> ctx.fillRect(t.x, t.y-t.height, t.width, t.height));
  ctx.fillStyle = currentWorld.accent + '33';
  platformsPool.all.forEach(p=> ctx.fillRect(p.x,p.y,p.width,p.height));
  ctx.fillStyle = '#ffd23f';
  coinsPool.all.forEach(c=>{
    ctx.beginPath(); ctx.arc(c.x+c.width/2,c.y+c.height/2,c.width/2,0,Math.PI*2); ctx.fill();
  });
  powerUpsPool.all.forEach(p=>{ ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,p.width,p.height); });
  particlesPool.all.forEach(p=>{
    const alpha = 1 - p.life/p.maxLife;
    ctx.globalAlpha = Math.max(alpha,0); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  });
  drawPlayer();
}

/* ============================================================
   13) الحلقة الرئيسية
   ============================================================ */
let rafId = null;
function loop(t){
  if(isGameOver) return;
  const dt = Math.min(t - lastTime, 48); // حماية من قفزات كبيرة عند تجميد التطبيق
  lastTime = t;
  update(dt);
  drawWorld();
  updateHUD();
  rafId = requestAnimationFrame(loop);
}

function triggerGameOver(){
  if(isGameOver) return;
  isGameOver = true;
  spawnExplosion(player.x+player.width/2, player.y+player.height/2);
  AudioManager.playHit(); AudioManager.stopMusic();
  const finalScore = Math.floor(score);
  SAVE.totalCoins += coinCount;
  if(finalScore > SAVE.highScore) SAVE.highScore = finalScore;
  checkAchievements();
  SaveManager.save(SAVE);
  document.getElementById('goScore').textContent = finalScore;
  document.getElementById('goBest').textContent = SAVE.highScore;
  document.getElementById('goCoins').textContent = coinCount;
  setState('gameover');
}

/* ============================================================
   14) آلة الحالات + إدارة الشاشات (UIManager)
   ============================================================ */
const body = document.body;
let state = 'boot';
function setState(next){
  state = next;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.querySelector(`[data-screen="${next}"]`);
  if(el) el.classList.add('active');
  body.className = 'in-' + next;
  if(next === 'menu') refreshMenu();
  if(next === 'shop') renderShop();
}

function updateHUD(){
  document.getElementById('hudScore').textContent = Math.floor(score);
  document.getElementById('hudCoins').textContent = '🪙 ' + coinCount;
  document.getElementById('hudBest').textContent = '🏆 ' + SAVE.highScore;
}

function refreshMenu(){
  document.getElementById('menuBest').textContent = SAVE.highScore;
  document.getElementById('menuCoins').textContent = SAVE.totalCoins;
  const strip = document.getElementById('worldStrip'); strip.innerHTML = '';
  WORLDS.forEach(w=>{
    const unlocked = SAVE.unlockedWorlds.includes(w.id);
    const chip = document.createElement('div');
    chip.className = 'world-chip' + (unlocked ? ' unlocked' : '');
    chip.style.color = w.accent;
    chip.textContent = unlocked ? w.name : '🔒 '+w.name;
    strip.appendChild(chip);
  });
}

function checkAchievements(){
  const stats = { bestScore: SAVE.highScore, totalCoins: SAVE.totalCoins,
    unlockedWorlds: SAVE.unlockedWorlds, unlockedSkins: SAVE.unlockedSkins };
  ACHIEVEMENTS.forEach(a=>{
    if(!SAVE.unlockedAchievements.includes(a.id) && a.check(stats)){
      SAVE.unlockedAchievements.push(a.id);
      showCombo('🏅 إنجاز: ' + a.name);
    }
  });
}

function renderShop(){
  document.getElementById('shopCoins').textContent = '🪙 ' + SAVE.totalCoins;
  const grid = document.getElementById('skinGrid'); grid.innerHTML = '';
  SKINS.forEach(skin=>{
    const unlocked = SAVE.unlockedSkins.includes(skin.id);
    const selected = SAVE.selectedSkin === skin.id;
    const card = document.createElement('div');
    card.className = 'skin-card' + (selected ? ' selected' : '') + (unlocked ? '' : ' locked');
    card.innerHTML = `<div class="swatch" style="background:${skin.outer}; box-shadow:0 0 12px ${skin.glow}"></div>
      <div class="name">${skin.name}</div>
      <div class="cost">${unlocked ? (selected ? 'مُفعّل' : 'اضغط للتفعيل') : ('🪙 ' + skin.cost)}</div>`;
    card.addEventListener('click', ()=>{
      if(unlocked){
        SAVE.selectedSkin = skin.id;
      } else if(SAVE.totalCoins >= skin.cost){
        SAVE.totalCoins -= skin.cost;
        SAVE.unlockedSkins.push(skin.id);
        SAVE.selectedSkin = skin.id;
        checkAchievements();
      } else {
        showCombo('🪙 عملات غير كافية');
        return;
      }
      SaveManager.save(SAVE);
      renderShop();
    });
    grid.appendChild(card);
  });
}

let comboTimer = null;
function showCombo(text){
  const el = document.getElementById('comboBanner');
  el.textContent = text; el.style.opacity = 1;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(()=> el.style.opacity = 0, 1200);
}

/* ============================================================
   15) ربط الواجهات بالأحداث
   ============================================================ */
document.getElementById('btnPlay').addEventListener('click', ()=>{
  startRun(); setState('playing'); lastTime = performance.now(); rafId = requestAnimationFrame(loop);
});
document.getElementById('btnSettings').addEventListener('click', ()=> setState('settings'));
document.getElementById('btnShop').addEventListener('click', ()=> setState('shop'));
document.getElementById('btnBackFromShop').addEventListener('click', ()=> setState('menu'));
document.getElementById('btnBackFromSettings').addEventListener('click', ()=> setState('menu'));
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if(state !== 'playing') return;
  cancelAnimationFrame(rafId); AudioManager.stopMusic(); setState('paused');
});
document.getElementById('btnResume').addEventListener('click', ()=>{
  setState('playing'); lastTime = performance.now(); AudioManager.resumeMusic(); rafId = requestAnimationFrame(loop);
});
document.getElementById('btnRestartFromPause').addEventListener('click', ()=>{
  startRun(); setState('playing'); rafId = requestAnimationFrame(loop);
});
document.getElementById('btnMenuFromPause').addEventListener('click', ()=>{
  AudioManager.stopMusic(); setState('menu');
});
document.getElementById('btnRestart').addEventListener('click', ()=>{
  startRun(); setState('playing'); rafId = requestAnimationFrame(loop);
});
document.getElementById('btnMenuFromGameOver').addEventListener('click', ()=> setState('menu'));

document.getElementById('btnResetProgress').addEventListener('click', ()=>{
  SAVE = SaveManager.defaults(); SaveManager.save(SAVE); refreshMenu();
});

const musicSlider = document.getElementById('musicSlider');
const sfxSlider = document.getElementById('sfxSlider');
musicSlider.addEventListener('input', e=>{ AudioManager.setMusicVolume(e.target.value/100); SaveManager.save(SAVE); });
sfxSlider.addEventListener('input', e=>{ AudioManager.setSfxVolume(e.target.value/100); SaveManager.save(SAVE); });

const vibToggle = document.getElementById('vibToggle');
vibToggle.addEventListener('click', ()=>{
  SAVE.settings.vibration = !SAVE.settings.vibration;
  vibToggle.classList.toggle('on', SAVE.settings.vibration);
  SaveManager.save(SAVE);
});

/* التحكم باللمس/الضغط أثناء اللعب فقط */
function handlePointer(e){
  if(state !== 'playing') return;
  jump();
}
document.addEventListener('touchstart', handlePointer, {passive:true});
document.addEventListener('mousedown', handlePointer);

/* ============================================================
   16) الإقلاع
   ============================================================ */
function boot(){
  musicSlider.value = Math.round(SAVE.settings.music*100);
  sfxSlider.value = Math.round(SAVE.settings.sfx*100);
  vibToggle.classList.toggle('on', SAVE.settings.vibration);
  AudioManager.setMusicVolume(SAVE.settings.music);
  AudioManager.setSfxVolume(SAVE.settings.sfx);
  setTimeout(()=> setState('menu'), 500);
}
boot();

})();
</script>
